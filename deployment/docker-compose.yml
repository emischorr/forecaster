version: "3.7"
services:
  forecaster:
    image: emischorr/forecaster:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # holds pv_forecast_ensemble.bin (trained with `mix pv.train`)
      - ./data:/data:ro
    environment:
      - FORECAST_PLACE=
      - FORECAST_COUNTRY=
      - FORECAST_PLACE_NAME=
      - FORECAST_PLACE_ID=
      - MQTT_HOST=
      - MQTT_PORT=1883
      - MQTT_USER=
      - MQTT_PW=
